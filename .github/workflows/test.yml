name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# The unit legs do not launch a browser. The visual job overrides this.
env:
  PUPPETEER_SKIP_DOWNLOAD: "1"

# Newest push to a given PR/branch wins; never pile up stale test runs.
# Safe to cancel here: this workflow only runs tests (no deploy/publish side effects).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI policy: private self-hosted runner pool only (boiler-snake-runner-01..03
# on the docker host — three bridge-networked containers, one job each, so up
# to 3 CI jobs run concurrently). Do not switch jobs to ubuntu-latest /
# public runners.
jobs:
  test:
    runs-on: [self-hosted, linux, X64]
    timeout-minutes: 15
    strategy:
      matrix:
        # Floor follows jsdom 30 (gork read_page): Node ^22.22.2 || ^24.15.0 || >=26.
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Build forge console assets
        run: npm run assets:build
      # #620 ambient-DB canary: every db-aware test must bind a PRIVATE temp
      # DB (loadDb/createIntegrationEnv/createE2eEnv — test/README.md #6).
      # Block the default path (project-root xpbot.sqlite) with a DIRECTORY:
      # any process that opens sqlite WITHOUT binding env first crashes with
      # SQLITE_CANTOPEN, and its require stack names the offending test file.
      # Static pins (test/db-binding-discipline.test.js) cannot see requires
      # evaluated at node:test COLLECTION time; this catches the class live.
      - name: Ambient-DB canary (block default DB_PATH)
        run: mkdir xpbot.sqlite
      # The Node 22 leg (engines floor) runs the full suite under the coverage
      # gate (audit issue #203): test:coverage executes the SAME files as
      # `npm test` (test/*.test.js + test/integration/*.test.js) plus the
      # thresholds in package.json, so one matrix leg covers execution + gate
      # without double-running the suites. The 24.x leg keeps plain `npm test`.
      - name: npm run test:coverage (coverage gate)
        if: matrix.node-version == '22.x'
        run: npm run test:coverage
      - name: npm test
        if: matrix.node-version != '22.x'
        run: npm test
      - name: Ambient-DB canary cleanup
        if: always()
        run: rm -rf xpbot.sqlite

  # #710: puppeteer screenshots of the forge shell + dashboard fixtures.
  # Its own leg so the coverage gate does not need Chrome. The runner cannot
  # apt-get, so Chrome runs in scripts/visual/Dockerfile. Baselines live in
  # test/visual/baselines; a pixel diff fails the job.
  visual:
    runs-on: [self-hosted, linux, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # docker/setup-buildx-action@v4.4.1
      - name: Forge visual regression
        run: |
          set -euo pipefail
          docker buildx build --load -f scripts/visual/Dockerfile -t forge-visual:ci .
          docker rm -f forge-visual-ci >/dev/null 2>&1 || true
          set +e
          docker run --name forge-visual-ci forge-visual:ci
          status=$?
          set -e
          mkdir -p test/visual
          docker cp forge-visual-ci:/app/test/visual/diff test/visual/ || true
          docker cp forge-visual-ci:/app/test/visual/actual test/visual/ || true
          docker cp forge-visual-ci:/app/test/visual/csp-evidence.json test/visual/ || true
          docker rm forge-visual-ci >/dev/null 2>&1 || true
          exit "$status"
      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7.0.2
        with:
          name: forge-visual-diff
          path: |
            test/visual/diff
            test/visual/actual
            test/visual/csp-evidence.json
          retention-days: 5

  # Build the VitePress site on every PR (audit issue #203): docs.yml only
  # builds on push to main, so dead links previously surfaced at deploy time.
  # VitePress fails the build on dead links by default (no ignoreDeadLinks in
  # docs/.vitepress/config.mjs), so this job is the dead-link gate.
  # Always-on rather than docs/**-path-filtered: the job costs ~1-2 min
  # (npm ci + ~5s vitepress build) and path filters would let package.json /
  # vitepress dependency bumps slip through untested.
  docs:
    runs-on: [self-hosted, linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:build

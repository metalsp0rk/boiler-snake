name: Self-hosted runner smoke test

# Manual-only smoke test proving the repo's self-hosted runner
# (boiler-snake-runner-01 on the docker host) can run the project's
# CI path: checkout -> setup-node -> npm ci -> npm test.
# Trigger: gh workflow run selfhosted-smoke.yml --ref <branch>

on:
  workflow_dispatch:

jobs:
  smoke:
    name: npm ci + npm test (self-hosted)
    runs-on: [self-hosted, linux, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Runner info
        run: |
          echo "runner=${{ runner.name }}"
          echo "os=${{ runner.os }} arch=${{ runner.arch }} temp=${{ runner.temp }}"
          uname -a
          git --version

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

name: Self-hosted runner smoke test

# Manual-only smoke test proving the repo's self-hosted runner
# (boiler-snake-runner-01 on the docker host) can run the project's
# CI path: checkout -> setup-node -> npm ci -> npm test.
# Trigger: gh workflow run selfhosted-smoke.yml --ref <branch>

on:
  workflow_dispatch:

permissions:
  contents: read

# Manual smoke runs: never auto-cancel an in-flight one (it is usually the
# subject of debugging); concurrent dispatches on the same ref queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    name: npm ci + npm test (self-hosted)
    runs-on: [self-hosted, linux, X64]
    timeout-minutes: 30
    steps:
      # Previously this line was corrupted to `uses: actions/checkout@: npm
      # ci` (invalid ref) — restored to a real checkout; the install step
      # below already runs `npm ci`.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4.4.0

      - name: Runner info
        run: |
          echo "runner=${{ runner.name }}"
          echo "os=${{ runner.os }} arch=${{ runner.arch }} temp=${{ runner.temp }}"
          uname -a
          git --version

      - name: Use Node.js 22.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # actions/setup-node@v7.1.0
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

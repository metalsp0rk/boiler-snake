name: Docker Publish

on:
  release:
    types: [published]
  # Reusable call from release-please.yml (release events created by the
  # default GITHUB_TOKEN do not fire `on: release` downstream workflows).
  workflow_call:
    inputs:
      tag_name:
        description: Release tag to label the image (e.g. v1.7.0).
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      tag_name:
        description: Optional tag to label the image (e.g. v1.3.0). Leave empty for latest only.
        required: false
        type: string

permissions:
  contents: read
  packages: write

# Single serialization group, never cancel: this workflow pushes multi-arch
# images to GHCR for releases. A cancelled run could leave a half-pushed
# (partial-arch / stale-latest) image set, and two concurrent publishes
# racing on the same tags is exactly what the group prevents — concurrent
# triggers queue instead of cancelling or colliding. The group name differs
# from the caller's (release-please) so the caller/cancel trap for reusable
# workflows cannot fire.
concurrency:
  group: docker-publish
  cancel-in-progress: false

# CI policy: private self-hosted runner only (boiler-snake-runner-01 on the
# docker host — native docker daemon). Do not switch jobs to ubuntu-latest /
# public runners.
jobs:
  build-and-push:
    runs-on: [self-hosted, linux, X64]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4.4.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # docker/setup-qemu-action@v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # docker/login-action@v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Resolve tag name
        id: tag
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            echo "name=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            echo "name=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # docker/metadata-action@v5.10.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable=true
            type=semver,pattern={{version}},value=${{ steps.tag.outputs.name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.tag.outputs.name }}
            type=semver,pattern={{major}},value=${{ steps.tag.outputs.name }}
            type=raw,value=${{ steps.tag.outputs.name }},enable=${{ steps.tag.outputs.name != '' }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # docker/build-push-action@v6.19.2
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

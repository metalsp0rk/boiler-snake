name: E2E (fauxcord mock Discord)

# Tier-4 E2E suite: boots the real bot against a pinned+patched fauxcord
# mock (scripts/e2e/start-mock.sh). See docs/e2e.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI policy: private self-hosted runner only (boiler-snake-runner-01 on the
# docker host). Do not switch jobs to ubuntu-latest / public runners.
jobs:
  e2e:
    runs-on: [self-hosted, linux, X64]
    timeout-minutes: 15
    env:
      FAUXCORD_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4.4.0
        with:
          # Engines floor (same leg policy as test.yml's coverage gate).
          node-version: 22.x
          cache: npm
      - run: npm ci

      # TEMP DIAGNOSTIC (ci/e2e-runner-diag only — do not merge): surface the
      # real fauxcord `npm install` failure that start-mock.sh silences on the
      # self-hosted runner.
      - name: DIAG runner env + verbose fauxcord install
        run: |
          uname -a
          cat /etc/os-release || true
          node -v; npm -v
          for t in python3 make g++ cc ldd curl git; do
            printf '%-8s ' "$t"; command -v "$t" || echo MISSING
          done
          rm -rf /tmp/opencode/fauxcord-diag
          git clone --quiet https://github.com/tomacheese/fauxcord /tmp/opencode/fauxcord-diag
          git -C /tmp/opencode/fauxcord-diag checkout --quiet --detach fe7a9f5c2b61ab100c1b933220c7d1d92921dcb9
          cd /tmp/opencode/fauxcord-diag
          npm install --no-audit --no-fund

      # Clone fauxcord at the pinned commit, apply the vendored patch series
      # (scripts/e2e/fauxcord-e2e.patch), install, start, wait for health.
      - name: Start fauxcord mock
        run: scripts/e2e/start-mock.sh

      - name: npm run test:e2e
        run: npm run test:e2e

      # Mock-side log is the first thing to triage when the suite fails.
      - name: Upload mock log (on failure)
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # actions/upload-artifact@v4.4.3
        with:
          name: fauxcord-log
          path: /tmp/opencode/fauxcord-data-e2e/fauxcord.log
          retention-days: 5

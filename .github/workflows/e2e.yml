name: E2E (fauxcord mock Discord)

# Tier-4 E2E suite: boots the real bot against a pinned+patched fauxcord
# mock (scripts/e2e/start-mock.sh). See docs/e2e.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PUPPETEER_SKIP_DOWNLOAD: "1"

# G2-5 (#450): the e2e mock Discord is HOST-GLOBAL (port 3100, shared data
# dir, deterministic namespace ids) and every job lands on the single
# self-hosted runner. A per-ref group let a PR run and a push-to-main run
# execute concurrently, wiping each other's guilds via provision() — or
# restarting the shared mock mid-suite when patch pins differed. Serialize
# all e2e runs behind one fixed group (same pattern docker-publish.yml uses
# for this exact shared-resource reason); the suite is ~4 min, so queueing
# is cheap. No cancel: killing a run mid-suite would strand mock state.
concurrency:
  group: fauxcord-e2e
  cancel-in-progress: false

# CI policy: private self-hosted runner pool only (boiler-snake-runner-01..03
# on the docker host — three bridge-networked containers, one job each, so up
# to 3 CI jobs run concurrently). Do not switch jobs to ubuntu-latest /
# public runners.
#
# Parallel-safe (closes #450): each runner instance is its own container with
# its own network namespace and container-local /tmp/opencode, so the fauxcord
# mock (PORT 3100 + FAUXCORD_DATA_DIR) is per-instance — concurrent e2e runs
# on different instances can never share a mock, and two jobs never share one
# instance (one job per runner). The fixed concurrency group above serializes
# EVERY e2e run (cancel is off, so queued runs wait instead of displacing).
jobs:
  e2e:
    runs-on: [self-hosted, linux, X64]
    timeout-minutes: 15
    env:
      FAUXCORD_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # actions/setup-node@v7.1.0
        with:
          # Engines floor (same leg policy as test.yml's coverage gate).
          node-version: 22.x
          cache: npm
      - run: npm ci

      # Clone fauxcord at the pinned commit, apply the vendored patch series
      # (scripts/e2e/fauxcord-e2e.patch), install, start, wait for health.
      - name: Start fauxcord mock
        run: scripts/e2e/start-mock.sh

      - name: npm run test:e2e
        run: npm run test:e2e

      # Mock-side log is the first thing to triage when the suite fails.
      - name: Upload mock log (on failure)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7.0.2
        with:
          name: fauxcord-log
          path: /tmp/opencode/fauxcord-data-e2e/fauxcord.log
          retention-days: 5

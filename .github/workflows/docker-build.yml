name: Docker Build (PR)

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - src/**
      - scripts/**
      - docker-compose.yml

permissions:
  contents: read

# PR-only workflow with no publish side effects: a newer push may cancel
# the superseded build. Grouped per ref so concurrent PRs never collide.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI policy: private self-hosted runner pool only (boiler-snake-runner-01..03
# on the docker host — three bridge-networked containers, one job each, so up
# to 3 CI jobs run concurrently). Do not switch jobs to ubuntu-latest /
# public runners.
jobs:
  build:
    runs-on: [self-hosted, linux, X64]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # docker/setup-buildx-action@v4.4.1

      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # docker/build-push-action@v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: boiler-snake:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max

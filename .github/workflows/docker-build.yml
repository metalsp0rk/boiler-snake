name: Docker Build (PR)

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - src/**
      - scripts/**
      - docker-compose.yml

permissions:
  contents: read

# PR-only workflow with no publish side effects: a newer push may cancel
# the superseded build. Grouped per ref so concurrent PRs never collide.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # docker/setup-buildx-action@v3.12.0

      - name: Build (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # docker/build-push-action@v6.19.2
        with:
          context: .
          push: false
          load: true
          tags: boiler-snake:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max

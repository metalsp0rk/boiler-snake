services:
  lavalink:
    # Lavalink 4.2+ required for Discord DAVE (E2EE voice). Do not pin below 4.2.2.
    image: ghcr.io/lavalink-devs/lavalink:4
    restart: unless-stopped
    environment:
      _JAVA_OPTIONS: -Xmx512M
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      # No public default (#455, audit H2-7): the old `:-<public default>`
      # made the bot's #205 boot fail-fast unreachable under compose and left
      # the node on Lavalink's most-published auth. Compose now ABORTS with
      # this message when the variable is unset or empty.
      LAVALINK_SERVER_PASSWORD: "${LAVALINK_PASSWORD:?LAVALINK_PASSWORD must be set in .env - any strong shared secret, must match the bot - no public default (audit 455)}"
    volumes:
      - ./deploy/lavalink/application.yml:/opt/Lavalink/application.yml:ro
      - lavalink-plugins:/opt/Lavalink/plugins
    expose:
      - "2333"

  bot:
    image: ghcr.io/metalsp0rk/boiler-snake:latest
    build: .
    env_file: .env
    depends_on:
      - lavalink
    environment:
      DATA_DIR: /data
      # Fixed process clock (audit #206): the daily decay cron is the hardcoded
      # `0 4 * * *` and node-cron evaluates it in the process timezone — an
      # unset TZ makes "4 AM" drift with the host. UTC keeps decay at 04:00 UTC
      # on every deploy; override in .env only if you really want local time.
      TZ: ${TZ:-UTC}
      LAVALINK_HOST: lavalink
      LAVALINK_PORT: "2333"
      LAVALINK_PASSWORD: "${LAVALINK_PASSWORD:?LAVALINK_PASSWORD must be set in .env - the bot refuses the node public default (audit 455); see docs/music.md}"
      # Optional: expose ticket transcripts (set TICKET_HTTP_PORT + TICKET_PUBLIC_BASE_URL in .env)
      # TICKET_HTTP_PORT: "8080"
    volumes:
      - bot-data:/data
    # ports:
    #   - "8080:8080"  # ticket HTML transcripts when TICKET_HTTP_PORT is set
    restart: unless-stopped

volumes:
  bot-data:
  lavalink-plugins:
